[workspace]
resolver = "2"
members = [
    "crates/coredeck-protocol",
    "crates/coredeck-daemon",
    "crates/coredeck-claude",
]

# Default members for `cargo build` / `cargo run`
default-members = ["crates/coredeck-daemon"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
