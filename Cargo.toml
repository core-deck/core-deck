[workspace]
resolver = "2"
members = [
    "crates/coredeck-protocol",
    "crates/coredeck",
    "crates/coredeck-claude",
]

# Default members for `cargo build` / `cargo run`
default-members = ["crates/coredeck"]

# Single source of truth for fields shared by every crate. Bumping the
# release version is now a one-line change here (plus macos/Info.plist
# and the cask — see macos/BUILD.md). Each crate opts in with
# `version.workspace = true` etc.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
