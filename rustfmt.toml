# Rust formatting configuration for Core Deck
edition = "2021"
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
use_small_heuristics = "Default"
reorder_imports = true
reorder_modules = true
remove_nested_parens = true
# Note: format_strings / format_macro_matchers / format_macro_bodies are
# nightly-only and were dropped — stable `cargo fmt` ignored them with a
# warning, and they were set to their defaults anyway.
