name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # On a tag push, assert the tag matches the workspace crate version.
  # create-dmg.sh derives the DMG name from Cargo.toml while artifact
  # names come from the tag — a mismatch ships a DMG the cask URL can't
  # find and an update checker that loops on "update available". Fail
  # fast before building anything.
  verify-version:
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare tag to crate version
        run: |
          tag_version="${GITHUB_REF#refs/tags/v}"
          crate_version="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')"
          echo "tag=$tag_version crate=$crate_version"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::Tag v$tag_version does not match workspace version $crate_version (Cargo.toml [workspace.package]). Bump the version before tagging."
            exit 1
          fi

  # Build daemon + wrapper for each architecture on native runners
  build-macos-arm64:
    needs: verify-version
    # needs: is skipped automatically when verify-version is skipped
    # (non-tag dispatch), so workflow_dispatch builds still run.
    if: ${{ always() && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped') }}
    runs-on: macos-14  # ARM64 runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build for ARM64
        run: cargo build --release --workspace --target aarch64-apple-darwin

      - name: Upload ARM64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: binary-arm64
          path: |
            target/aarch64-apple-darwin/release/coredeck
            target/aarch64-apple-darwin/release/coredeck-claude

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          # libgtk-3-dev pulls atk-sys / gdk-pixbuf-sys / glib-sys (the
          # transitive build deps of `tray-icon` on Linux); libxdo-dev
          # is what muda links against for menu/window plumbing;
          # libayatana-appindicator3-dev is the StatusNotifierItem
          # backend the tray actually shows up under on KDE/GNOME.
          sudo apt-get install -y \
              libudev-dev libhidapi-dev libgtk-3-dev libxdo-dev \
              libayatana-appindicator3-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build for ${{ matrix.arch }} Linux
        # `strip = true` in [profile.release] already strips symbols, so
        # no separate strip step is needed.
        run: cargo build --release --workspace --target ${{ matrix.rust_target }}

      - name: Upload Linux ${{ matrix.arch }} binaries
        uses: actions/upload-artifact@v4
        with:
          name: binary-linux-${{ matrix.arch }}
          path: |
            target/${{ matrix.rust_target }}/release/coredeck
            target/${{ matrix.rust_target }}/release/coredeck-claude

  # Bundle the arm64 binary into a signed app. Intel macOS support
  # was dropped here because GitHub's macos-13 runner queue can take
  # 12+ hours and was blocking tagged releases. Re-add a
  # build-macos-x86_64 job + lipo step if Intel users actually ask.
  package-macos:
    needs: [build-macos-arm64]
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install librsvg

      - name: Download ARM64 binaries
        uses: actions/download-artifact@v4
        with:
          name: binary-arm64
          path: target/aarch64-apple-darwin/release/

      - name: Make binaries executable
        run: |
          chmod +x target/aarch64-apple-darwin/release/coredeck
          chmod +x target/aarch64-apple-darwin/release/coredeck-claude

      - name: Verify binaries
        run: |
          file target/aarch64-apple-darwin/release/coredeck
          file target/aarch64-apple-darwin/release/coredeck-claude

      - name: Generate app icon
        run: ./macos/scripts/generate-icon.sh

      - name: Bundle arm64 binaries
        run: ./macos/scripts/bundle.sh --arm64-only

      - name: Verify bundled binaries
        run: |
          file "dist/Core Deck.app/Contents/MacOS/coredeck"
          file "dist/Core Deck.app/Contents/MacOS/coredeck-claude"

      - name: Import signing certificate
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Allow codesign to access the key
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          rm certificate.p12

      - name: Sign and notarize app
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          ./macos/scripts/sign.sh \
            --identity "$SIGNING_IDENTITY" \
            --team-id "$TEAM_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APP_PASSWORD"

      - name: Ad-hoc sign (unsigned build)
        # The env block is required: without it env.MACOS_CERTIFICATE is empty
        # here even when the secret is set, and this step would clobber the
        # Developer ID signature created above.
        if: ${{ env.MACOS_CERTIFICATE == '' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          echo "No signing certificate provided, creating ad-hoc signed build"
          codesign --force --deep --sign - "dist/Core Deck.app"

      - name: Create DMG
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          if [ -n "$SIGNING_IDENTITY" ]; then
            # APPLE_ID/APP_PASSWORD are read from the environment by the
            # script; it has no --apple-id flag.
            ./macos/scripts/create-dmg.sh \
              --identity "$SIGNING_IDENTITY" \
              --team-id "$TEAM_ID"
          else
            ./macos/scripts/create-dmg.sh --skip-notarize
          fi

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*\"\(.*\)\"/\1/')" >> $GITHUB_OUTPUT
          fi

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoreDeck-${{ steps.version.outputs.version }}-macos-arm64
          path: dist/*.dmg

  package-linux:
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: binary-linux-${{ matrix.arch }}
          path: dist/linux/

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')" >> $GITHUB_OUTPUT
          fi

      - name: Stage tarball contents
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Layout the user sees after extracting the tarball:
          #   coredeck-<version>-linux-<arch>/
          #     bin/coredeck
          #     bin/coredeck-claude
          #     udev/99-coredeck.rules
          #     install.sh         (one-shot installer; calls `coredeck setup`)
          #     README.md          (excerpt of docs/linux-setup.md)
          #     LICENSE
          STAGE="dist/coredeck-$VERSION-linux-$ARCH"
          mkdir -p "$STAGE/bin" "$STAGE/udev"
          install -m 0755 dist/linux/coredeck "$STAGE/bin/coredeck"
          install -m 0755 dist/linux/coredeck-claude "$STAGE/bin/coredeck-claude"

          # install.sh and the udev rules are committed under linux/ so
          # they're reviewable and shellcheck'd in CI; just copy them in.
          install -m 0644 linux/99-coredeck.rules "$STAGE/udev/99-coredeck.rules"
          install -m 0755 linux/install.sh "$STAGE/install.sh"

          # Lift the README from docs/linux-setup.md so the tarball is
          # self-contained — saves users a trip to the repo.
          cp docs/linux-setup.md "$STAGE/README.md"
          cp LICENSE "$STAGE/LICENSE" 2>/dev/null || true

          tar -C dist -czf "dist/coredeck-$VERSION-linux-$ARCH.tar.gz" \
              "coredeck-$VERSION-linux-$ARCH"
          ls -lh dist/

      - name: Upload Linux tarball
        uses: actions/upload-artifact@v4
        with:
          name: coredeck-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}
          path: dist/coredeck-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz

  create-release:
    needs: [package-macos, package-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: CoreDeck-${{ steps.version.outputs.version }}-macos-arm64
          path: artifacts

      - name: Download Linux tarballs
        uses: actions/download-artifact@v4
        with:
          # Matches every per-arch artifact uploaded by `package-linux`
          # (currently x86_64 + arm64). `merge-multiple` flattens them
          # into `artifacts/` so the gh-release `files:` glob picks up
          # both tarballs without per-arch download blocks.
          pattern: coredeck-${{ steps.version.outputs.version }}-linux-*
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Core Deck v${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*.dmg
            artifacts/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
