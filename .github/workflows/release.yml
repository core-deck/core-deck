name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build daemon + wrapper for each architecture on native runners
  build-macos-arm64:
    runs-on: macos-14  # ARM64 runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build for ARM64
        run: cargo build --release --workspace --target aarch64-apple-darwin

      - name: Upload ARM64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: binary-arm64
          path: |
            target/aarch64-apple-darwin/release/coredeck
            target/aarch64-apple-darwin/release/coredeck-claude

  build-macos-x86_64:
    runs-on: macos-13  # Intel runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build for x86_64
        run: cargo build --release --workspace --target x86_64-apple-darwin

      - name: Upload x86_64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: binary-x86_64
          path: |
            target/x86_64-apple-darwin/release/coredeck
            target/x86_64-apple-darwin/release/coredeck-claude

  build-linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          # libgtk-3-dev pulls atk-sys / gdk-pixbuf-sys / glib-sys —
          # the transitive build deps of `tray-icon` on Linux.
          sudo apt-get install -y libudev-dev libhidapi-dev libgtk-3-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build for x86_64 Linux
        run: cargo build --release --workspace --target x86_64-unknown-linux-gnu

      - name: Strip binaries
        run: |
          strip target/x86_64-unknown-linux-gnu/release/coredeck
          strip target/x86_64-unknown-linux-gnu/release/coredeck-claude

      - name: Upload Linux x86_64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: binary-linux-x86_64
          path: |
            target/x86_64-unknown-linux-gnu/release/coredeck
            target/x86_64-unknown-linux-gnu/release/coredeck-claude

  # Combine binaries and create signed app bundle
  package-macos:
    needs: [build-macos-arm64, build-macos-x86_64]
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install librsvg

      - name: Download ARM64 binaries
        uses: actions/download-artifact@v4
        with:
          name: binary-arm64
          path: target/aarch64-apple-darwin/release/

      - name: Download x86_64 binaries
        uses: actions/download-artifact@v4
        with:
          name: binary-x86_64
          path: target/x86_64-apple-darwin/release/

      - name: Make binaries executable
        run: |
          chmod +x target/aarch64-apple-darwin/release/coredeck
          chmod +x target/aarch64-apple-darwin/release/coredeck-claude
          chmod +x target/x86_64-apple-darwin/release/coredeck
          chmod +x target/x86_64-apple-darwin/release/coredeck-claude

      - name: Verify binaries
        run: |
          file target/aarch64-apple-darwin/release/coredeck
          file target/aarch64-apple-darwin/release/coredeck-claude
          file target/x86_64-apple-darwin/release/coredeck
          file target/x86_64-apple-darwin/release/coredeck-claude

      - name: Generate app icon
        run: ./macos/scripts/generate-icon.sh

      - name: Create universal binaries and bundle
        run: ./macos/scripts/bundle.sh --lipo-only

      - name: Verify universal binaries
        run: |
          file "dist/Core Deck.app/Contents/MacOS/coredeck"
          file "dist/Core Deck.app/Contents/MacOS/coredeck-claude"
          lipo -info "dist/Core Deck.app/Contents/MacOS/coredeck"
          lipo -info "dist/Core Deck.app/Contents/MacOS/coredeck-claude"

      - name: Import signing certificate
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Allow codesign to access the key
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          rm certificate.p12

      - name: Sign and notarize app
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          ./macos/scripts/sign.sh \
            --identity "$SIGNING_IDENTITY" \
            --team-id "$TEAM_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APP_PASSWORD"

      - name: Ad-hoc sign (unsigned build)
        if: ${{ env.MACOS_CERTIFICATE == '' }}
        run: |
          echo "No signing certificate provided, creating ad-hoc signed build"
          codesign --force --deep --sign - "dist/Core Deck.app"

      - name: Create DMG
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          if [ -n "$SIGNING_IDENTITY" ]; then
            ./macos/scripts/create-dmg.sh \
              --identity "$SIGNING_IDENTITY" \
              --team-id "$TEAM_ID" \
              --apple-id "$APPLE_ID"
          else
            ./macos/scripts/create-dmg.sh --skip-notarize
          fi

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=$(grep '^version' crates/coredeck/Cargo.toml | head -1 | sed 's/.*\"\(.*\)\"/\1/')" >> $GITHUB_OUTPUT
          fi

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoreDeck-${{ steps.version.outputs.version }}-macos-universal
          path: dist/*.dmg

  package-linux:
    needs: build-linux-x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: binary-linux-x86_64
          path: dist/linux/

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=$(grep '^version' crates/coredeck/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')" >> $GITHUB_OUTPUT
          fi

      - name: Stage tarball contents
        run: |
          # Layout the user sees after extracting the tarball:
          #   coredeck-<version>-linux-x86_64/
          #     bin/coredeck
          #     bin/coredeck-claude
          #     udev/99-coredeck.rules
          #     install.sh         (one-shot installer; calls `coredeck setup`)
          #     README.md          (excerpt of docs/linux-setup.md)
          #     LICENSE
          STAGE="dist/coredeck-${{ steps.version.outputs.version }}-linux-x86_64"
          mkdir -p "$STAGE/bin" "$STAGE/udev"
          install -m 0755 dist/linux/coredeck "$STAGE/bin/coredeck"
          install -m 0755 dist/linux/coredeck-claude "$STAGE/bin/coredeck-claude"

          cat > "$STAGE/udev/99-coredeck.rules" <<'EOF'
          # Core Deck QMK Raw HID device — VID 0xFEED, PID 0x0803.
          # Drop into /etc/udev/rules.d/ then `sudo udevadm control --reload-rules && sudo udevadm trigger`.
          SUBSYSTEM=="hidraw", ATTRS{idVendor}=="feed", ATTRS{idProduct}=="0803", MODE="0666"
          SUBSYSTEM=="usb", ATTRS{idVendor}=="feed", ATTRS{idProduct}=="0803", MODE="0666"
          EOF

          cat > "$STAGE/install.sh" <<'EOF'
          #!/usr/bin/env bash
          # Install Core Deck binaries to ~/.local/bin, drop the udev
          # rules into /etc/udev/rules.d/ (asks for sudo), and run
          # `coredeck setup` to register hooks + the systemd user unit.
          set -euo pipefail
          here="$(cd "$(dirname "$0")" && pwd)"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$here/bin/coredeck" "$HOME/.local/bin/coredeck"
          install -m 0755 "$here/bin/coredeck-claude" "$HOME/.local/bin/coredeck-claude"
          if [ ! -f /etc/udev/rules.d/99-coredeck.rules ]; then
              echo "Installing udev rules (sudo)…"
              sudo install -m 0644 "$here/udev/99-coredeck.rules" /etc/udev/rules.d/99-coredeck.rules
              sudo udevadm control --reload-rules
              sudo udevadm trigger
          fi
          case ":$PATH:" in
              *":$HOME/.local/bin:"*) ;;
              *) echo "warning: ~/.local/bin is not on \$PATH; add it to your shell rc." ;;
          esac
          "$HOME/.local/bin/coredeck" setup
          echo
          echo "Done. Add this to your shell rc to wrap claude:"
          echo "    alias claude=\"coredeck-claude\""
          EOF
          chmod +x "$STAGE/install.sh"

          # Lift the README from docs/linux-setup.md so the tarball is
          # self-contained — saves users a trip to the repo.
          cp docs/linux-setup.md "$STAGE/README.md"
          cp LICENSE "$STAGE/LICENSE" 2>/dev/null || true

          tar -C dist -czf "dist/coredeck-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz" \
              "coredeck-${{ steps.version.outputs.version }}-linux-x86_64"
          ls -lh dist/

      - name: Upload Linux tarball
        uses: actions/upload-artifact@v4
        with:
          name: coredeck-${{ steps.version.outputs.version }}-linux-x86_64
          path: dist/coredeck-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz

  create-release:
    needs: [package-macos, package-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: CoreDeck-${{ steps.version.outputs.version }}-macos-universal
          path: artifacts

      - name: Download Linux tarball
        uses: actions/download-artifact@v4
        with:
          name: coredeck-${{ steps.version.outputs.version }}-linux-x86_64
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Core Deck v${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*.dmg
            artifacts/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
