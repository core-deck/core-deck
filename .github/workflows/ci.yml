name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

  build-arm64:
    runs-on: macos-14  # ARM64 runner
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Build release (ARM64)
        run: cargo build --release --workspace --target aarch64-apple-darwin

      - name: Verify binaries
        run: |
          file target/aarch64-apple-darwin/release/coredeck
          file target/aarch64-apple-darwin/release/coredeck-claude

  build-x86_64:
    runs-on: macos-13  # Intel runner
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Build release (x86_64)
        run: cargo build --release --workspace --target x86_64-apple-darwin

      - name: Verify binaries
        run: |
          file target/x86_64-apple-darwin/release/coredeck
          file target/x86_64-apple-darwin/release/coredeck-claude

  build-linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libhidapi-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Build release (x86_64 Linux)
        run: cargo build --release --workspace --target x86_64-unknown-linux-gnu

      - name: Run tests
        run: cargo test --workspace

      - name: Verify binaries
        run: |
          file target/x86_64-unknown-linux-gnu/release/coredeck
          file target/x86_64-unknown-linux-gnu/release/coredeck-claude
          # Cross-check the udev hotplug symbol made it in. If we
          # accidentally stop linking libudev on Linux this catches it
          # before users hit a runtime "watcher init failed" log.
          ldd target/x86_64-unknown-linux-gnu/release/coredeck | grep -q libudev
