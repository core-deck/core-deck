name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # --workspace matters: the root manifest sets default-members =
      # ["crates/coredeck"], so without it coredeck-claude and
      # coredeck-protocol are never linted or tested.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

  msrv:
    # The crates declare rust-version = "1.86"; verify the workspace still
    # builds on it so an accidental newer-stdlib use doesn't ship silently.
    # 1.86 is the real floor — reqwest's TLS/idna stack pulls hyper-rustls
    # (needs 1.85) and the icu crates (need 1.86). Expect to bump this as
    # those transitive deps move.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@1.86.0

      - uses: Swatinem/rust-cache@v2

      - name: Check on MSRV
        run: cargo check --workspace --all-features --locked

  shellcheck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        # The two scripts under crates/coredeck/scripts are embedded into
        # the daemon binary via include_str! and run on every hook, so
        # they're part of the product surface.
        run: |
          shellcheck \
            crates/coredeck/scripts/*.sh \
            scripts/*.sh \
            macos/scripts/*.sh \
            linux/install.sh

  build-arm64:
    runs-on: macos-14  # ARM64 runner
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release (ARM64)
        run: cargo build --release --workspace --locked --target aarch64-apple-darwin

      - name: Verify binaries
        run: |
          file target/aarch64-apple-darwin/release/coredeck
          file target/aarch64-apple-darwin/release/coredeck-claude

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          # libgtk-3-dev pulls atk-sys / gdk-pixbuf-sys / glib-sys (the
          # transitive build deps of `tray-icon` on Linux); libxdo-dev
          # is what muda links against for menu/window plumbing;
          # libayatana-appindicator3-dev is the StatusNotifierItem
          # backend the tray actually shows up under on KDE/GNOME.
          sudo apt-get install -y \
              libudev-dev libhidapi-dev libgtk-3-dev libxdo-dev \
              libayatana-appindicator3-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build release (${{ matrix.arch }} Linux)
        run: cargo build --release --workspace --locked --target ${{ matrix.rust_target }}

      # Clippy here too — the Linux-only code paths (udev hotplug, GTK
      # tray) never get linted by the macOS check job.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Verify binaries
        run: |
          file target/${{ matrix.rust_target }}/release/coredeck
          file target/${{ matrix.rust_target }}/release/coredeck-claude
          # Cross-check the udev hotplug symbol made it in. If we
          # accidentally stop linking libudev on Linux this catches it
          # before users hit a runtime "watcher init failed" log.
          ldd target/${{ matrix.rust_target }}/release/coredeck | grep -q libudev
