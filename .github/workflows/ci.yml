name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

  build-arm64:
    runs-on: macos-14  # ARM64 runner
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release (ARM64)
        run: cargo build --release --workspace --target aarch64-apple-darwin

      - name: Verify binaries
        run: |
          file target/aarch64-apple-darwin/release/coredeck
          file target/aarch64-apple-darwin/release/coredeck-claude

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          # libgtk-3-dev pulls atk-sys / gdk-pixbuf-sys / glib-sys (the
          # transitive build deps of `tray-icon` on Linux); libxdo-dev
          # is what muda links against for menu/window plumbing.
          sudo apt-get install -y \
              libudev-dev libhidapi-dev libgtk-3-dev libxdo-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release (${{ matrix.arch }} Linux)
        run: cargo build --release --workspace --target ${{ matrix.rust_target }}

      - name: Run tests
        run: cargo test --workspace

      - name: Verify binaries
        run: |
          file target/${{ matrix.rust_target }}/release/coredeck
          file target/${{ matrix.rust_target }}/release/coredeck-claude
          # Cross-check the udev hotplug symbol made it in. If we
          # accidentally stop linking libudev on Linux this catches it
          # before users hit a runtime "watcher init failed" log.
          ldd target/${{ matrix.rust_target }}/release/coredeck | grep -q libudev
