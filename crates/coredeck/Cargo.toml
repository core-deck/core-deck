[package]
name = "coredeck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CoreDeck daemon: owns the HID device and serves the HTTP/WS APIs and Claude Code hook endpoints"
license.workspace = true

[[bin]]
name = "coredeck"
path = "src/main.rs"

[dependencies]
# Shared protocol types
coredeck-protocol = { path = "../coredeck-protocol" }

# Async runtime
tokio = { version = "1.43", features = ["full", "sync", "time", "process", "io-util", "signal"] }

# HTTP + WebSocket server
axum = { version = "0.8", features = ["ws"] }

# HTTP client — for the update checker. rustls-tls keeps us off
# OpenSSL on Linux; default-features off skips cookies/blocking/etc.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Version comparison for the update checker.
semver = "1.0"

# USB HID communication
hidapi = "2.6"

# System tray
tray-icon = "0.19"
winit = "0.30"

# Image handling for tray icons
png = "0.17"

# Configuration & serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
directories = "5.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"

# Concurrency
parking_lot = "0.12"

# WebSocket stream utilities
futures-util = "0.3"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Signal handling
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
core-foundation = "0.10"
core-foundation-sys = "0.8"
io-kit-sys = "0.4"
mach2 = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# Event-driven USB hotplug detection (counterpart to IOKit on macOS).
# Pulls libudev which is already a system dep for hidapi on Linux.
udev = "0.9"
# `tray-icon` panics with "GTK has not been initialized" on Linux
# unless we gtk::init() before building the tray, and its menu
# callbacks only fire while gtk::main() is pumping events. Both
# crates are already in our dep graph transitively (via tray-icon),
# we just need a direct dep so we can call into them. glib hosts
# the `timeout_add_local` we use to drain the tray-update channel
# from inside the GTK main loop.
gtk = "0.18"
glib = "0.18"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(feature, values(\"cargo-clippy\"))"] }
